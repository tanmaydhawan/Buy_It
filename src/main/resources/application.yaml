spring:
  application:
    name: buyit
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce?TimeZone=Asia/Kolkata
    username: admin
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      indent_output: true
server:
  port: 8080

